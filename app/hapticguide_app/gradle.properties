# Gradle JVM heap — sufficient for AGP 9 + Kotlin compilation
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX is the only supported support library path
android.useAndroidX=true

# Use Kotlin official code style
kotlin.code.style=official

# AGP 9.0 opts into the new DSL by default.
# Set to false only if a third-party plugin still requires the legacy DSL.
# android.newDsl=false

# AGP 9.0 enables built-in Kotlin by default.
# Set to false only if you need an older KGP version.
# android.builtInKotlin=false
